[build-system]
requires = ["hatchling", "hatch-nodejs-version"]
build-backend = "hatchling.build"

[project]
name = "superduperskills"
dynamic = ["version"]
description = "The Ultimate Multi-Agent Skills Hub & Governance Suite — 2,700+ curated AI agent skills for Claude, Gemini, Cursor, Codex, OpenCode, and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "camilolealdev", email = "camilolealdev@users.noreply.github.com" },
]
keywords = [
    "ai",
    "skills",
    "agents",
    "claude-code",
    "gemini-cli",
    "cursor-rules",
    "agentic-ai",
    "yagni",
    "anti-slop",
    "prompt-engineering",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://superduperskills.vercel.app"
Repository = "https://github.com/camilolealdev/superduperskills"
Issues = "https://github.com/camilolealdev/superduperskills/issues"
Documentation = "https://superduperskills.vercel.app"

[project.scripts]
sds = "superduper_cli:main"
superduperskills = "superduper_cli:main"

[project.entry-points."superduperskills.completions"]
bash = "completions/sds.bash"
zsh = "completions/sds.zsh"
fish = "completions/sds.fish"

[tool.hatch.version]
path = "scripts/superduper_cli.py"
pattern = "__version__\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["scripts/superduper_cli.py"]
artifacts = ["scripts/*.py"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/superduper_cli.py" = "superduper_cli.py"

[tool.hatch.build.targets.sdist]
include = [
    "scripts/superduper_cli.py",
    "scripts/qualify_project.py",
    "scripts/select_stack_skills.py",
    "completions/",
    "bin/",
    "skills/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
